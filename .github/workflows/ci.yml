name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Guard tests
        run: bash tests/test-guard.sh
      - name: Verify loop tests
        run: bash tests/test-verify.sh
      - name: Docs check gate tests
        run: bash tests/test-doc-check.sh
